<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notrip — Trip budgets</title>
    <link rel="icon" href="/no-trip/notrip-logo.jpg" type="image/jpeg" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 85% 8%, rgba(61, 111, 136, 0.16), transparent 34%),
          linear-gradient(180deg, #ffffff 0%, #f7fafb 42%, #edf5f7 100%);
      }

      #root {
        position: relative;
        z-index: 1;
        min-height: 100%;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #2b3436;
      }

      #boot-splash[hidden] {
        display: none;
      }

      #boot-splash .card {
        width: min(100%, 420px);
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 10px 30px rgba(43, 52, 54, 0.08);
        padding: 40px 28px;
        text-align: center;
      }

      #boot-splash .logo {
        width: 112px;
        height: 112px;
        margin: 0 auto;
        border-radius: 22%;
        object-fit: cover;
        box-shadow: 0 8px 20px rgba(43, 52, 54, 0.14);
      }

      #boot-splash .subtitle {
        margin: 16px 0 0;
        font-size: 14px;
        font-weight: 600;
        color: #566164;
      }

      #boot-splash .dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 28px;
      }

      #boot-splash .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #006a71;
        animation: splash-dot 1.05s ease-in-out infinite;
      }

      #boot-splash .dot:nth-child(2) {
        animation-delay: 0.15s;
      }

      #boot-splash .dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes splash-dot {
        0%,
        80%,
        100% {
          opacity: 0.28;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
    </style>
    <script type="module" crossorigin src="/no-trip/assets/index-CCj0HLHR.js"></script>
    <link rel="stylesheet" crossorigin href="/no-trip/assets/index-Bql4FsVC.css">
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="card">
        <img class="logo" src="/no-trip/notrip-logo.jpg" width="112" height="112" alt="Notrip" />
        <p class="subtitle">Trip budgets &amp; daily expenses</p>
        <div class="dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
